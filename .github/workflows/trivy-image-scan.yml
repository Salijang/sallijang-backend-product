name: Trivy Image Security Scan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/trivy-image-scan.yml'

jobs:
  trivy-image-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sallijang-backend-product:latest .

      - name: Run Trivy image scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: 'sallijang-backend-product:latest'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Print Trivy result
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            cat trivy-results.txt
          else
            echo "trivy-results.txt file was not created."
          fi

      - name: Send Slack alert on failure
        if: steps.trivy_scan.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ISSUE=$(grep -m 1 "HIGH" trivy-results.txt || grep -m 1 "CRITICAL" trivy-results.txt || echo "HIGH/CRITICAL 이미지 보안 이슈 발견")

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\":\"🛡️ *Trivy Image Security Alert*\n<@U0A5ZUZRT7A>\nRepository: sallijang-*backend-product*\n${ISSUE}\n확인: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          "$SLACK_WEBHOOK_URL"

      - name: Fail pipeline if Trivy found issues
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "Trivy found HIGH/CRITICAL image security issues. Failing pipeline."
          exit 1
