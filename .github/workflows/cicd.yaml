name: CI/CD Pipeline for Product Service

on:
  push:
    branches: [ "main", "dev_yji" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594486941613:role/pickup-github-actions-role
          aws-region: ap-northeast-2

      - name: Read deploy config from SSM
        run: |
          LAMBDA_BUCKET=$(aws ssm get-parameter --name /pickup/prod/s3/lambda-bucket-name --query Parameter.Value --output text)
          echo "LAMBDA_CODE_S3_BUCKET=$LAMBDA_BUCKET" >> $GITHUB_ENV

      - name: Build and upload image-resize Lambda to S3
        run: |
          cd lambda/image-resize
          npm install --platform=linux --arch=x64
          zip -r image-resize.zip handler.js node_modules/
          aws s3 cp image-resize.zip s3://${{ env.LAMBDA_CODE_S3_BUCKET }}/lambda/image-resize.zip

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Checkout Manifest Repository
        uses: actions/checkout@v4
        with:
          repository: Salijang/sallijang-manifest
          token: ${{ secrets.GHA_TOKEN }}
          path: manifest

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kubernetes resources
        run: |
          cd manifest/base/product
          REAL_IMAGE_URL="${{ steps.login-ecr.outputs.registry }}/${{ github.event.repository.name }}"
          kustomize edit set image product-image=$REAL_IMAGE_URL:${{ github.sha }}
          cat kustomization.yaml
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(product): update image tag to ${{ github.sha }} [skip ci]"
          git push origin main